name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: contract-bench (static layer — precision gate)
        run: |
          git config --global user.email "ci@bugwrap"
          git config --global user.name "ci"
          python -m bench.run
      - name: context-bench scale table
        run: python -m bench.context_bench --scale-only
