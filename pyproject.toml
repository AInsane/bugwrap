[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bugwrap"
version = "0.1.0"
description = "Smart Context code review for Python — local models, zero dependencies, provable findings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ivan Voropaiev", email = "ivan.vrp.fts@gmail.com" }]
keywords = ["code-review", "ast", "call-graph", "ollama", "static-analysis", "llm", "local-llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/AInsane/bugwrap"
Repository = "https://github.com/AInsane/bugwrap"
Issues = "https://github.com/AInsane/bugwrap/issues"
Roadmap = "https://github.com/AInsane/bugwrap/blob/main/ROADMAP.md"
# Zero runtime dependencies. Everything below is stdlib: ast, tomllib, urllib, difflib.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bugwrap = "bugwrap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bugwrap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
